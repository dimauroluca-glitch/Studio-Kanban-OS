<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio Kanban OS</title>
    <link rel="stylesheet" href="style.css?v=26.0">
</head>
<body>

    <div class="neon-orb orb-purple"></div>
    <div class="neon-orb orb-cyan"></div>

    <div class="app-viewport">
        <!-- Progress Bar Globale -->
        <div class="dashboard-progress-hub">
            <div class="hub-meta">
                <span class="hub-subtitle">PROGRESSO STUDIO</span>
                <span id="global-progress-percent" class="hub-percentage">0%</span>
            </div>
            <div class="hub-track">
                <div id="global-progress-bar" class="hub-fill"></div>
            </div>
        </div>

        <!-- Navbar Superiore -->
        <header class="main-navbar">
            <div class="brand">
                <h1>Studio Kanban <span class="badge-neon">PRO ENGINE</span></h1>
                <p>Dashboard offline adattiva per mobile e tablet.</p>
            </div>
            <div class="navbar-actions">
                <button id="btn-toggle-view" class="btn-action-glass" style="border-color: var(--neon-cyan); color: #22d3ee;">Vista Calendario 📅</button>
                <button id="enable-notifications" class="btn-action-glass">Notifiche</button>
            </div>
        </header>

        <main class="workspace-grid">
            <!-- Pannello Laterale (Form e Stats) -->
            <aside class="sidebar-controls mobile-panel" id="panel-form">
                
                <div class="control-box stats-card" id="panel-stats">
                    <h2>Performance</h2>
                    <div class="stats-grid-local">
                        <div class="stat-item-box">
                            <span class="stat-num" id="stat-total-done">0</span>
                            <span class="stat-lbl">Risolti</span>
                        </div>
                        <div class="stat-item-box">
                            <span class="stat-num" id="stat-streak">0 🔥</span>
                            <span class="stat-lbl">Streak</span>
                        </div>
                    </div>
                    <div class="backup-actions-zone">
                        <button id="btn-share-data" class="btn-neon-trigger" style="padding: 10px; font-size: 12px; background: linear-gradient(135deg, var(--neon-cyan), #3b82f6); width:100%;">🔗 Condividi Compiti</button>
                    </div>
                    <div class="subject-distribution-list" id="subject-stats-list"></div>
                </div>

                <div class="control-box form-card">
                    <div class="panel-header-mobile">
                        <h2 id="form-title">Nuovo Obiettivo</h2>
                        <button type="button" class="btn-close-panel" onclick="switchMobileView('todo')">✕</button>
                    </div>
                    <div id="task-form">
                        <input type="hidden" id="task-id">
                        
                        <div class="input-wrapper">
                            <label for="task-title">Nome Task o Argomento</label>
                            <input type="text" id="task-title" placeholder="Es: Esercizi o capitolo da studiare">
                        </div>
                        
                        <div class="input-wrapper">
                            <label for="task-subject">Materia</label>
                            <select id="task-subject">
                                <option value="#2563eb">🔵 Italiano</option>
                                <option value="#eab308">🟡 Storia</option>
                                <option value="#dc2626">🔴 Matematica</option>
                                <option value="#a855f7">🟣 Informatica</option>
                                <option value="#f1f5f9">⚪ Inglese</option>
                                <option value="#334155">⚫ Altro</option>
                            </select>
                        </div>
                        
                        <div class="input-wrapper">
                            <label for="task-type">Tipologia</label>
                            <select id="task-type">
                                <option value="compito">📚 Studio / Esercizio</option>
                                <option value="verifica">🚨 Verifica / Esame</option>
                            </select>
                        </div>
                        
                        <div class="input-wrapper">
                            <label for="task-date">Scadenza Tassativa</label>
                            <input type="date" id="task-date">
                        </div>
                        
                        <button type="button" id="btn-submit-task" class="btn-neon-trigger">Inietta nel Sistema</button>
                        <button type="button" id="cancel-edit-btn" class="btn-neon-abort hidden">Scollega Modifica</button>
                    </div>
                </div>
            </aside>

            <!-- Area Principale Destra -->
            <div class="main-display-area">
                
                <!-- Calendario -->
                <section class="calendar-view-container hidden-display">
                    <div class="calendar-header-controls">
                        <button id="btn-prev-month" class="btn-card">◀</button>
                        <h2 id="calendar-month-title">Mese Anno</h2>
                        <button id="btn-next-month" class="btn-card">▶</button>
                    </div>
                    <div class="calendar-weekdays-grid">
                        <div>Lun</div><div>Mar</div><div>Mer</div><div>Gio</div><div>Ven</div><div>Sab</div><div>Dom</div>
                    </div>
                    <div id="calendar-days-grid" class="calendar-days-grid"></div>
                </section>

                <!-- Kanban Deck -->
                <section class="kanban-deck" id="main-kanban-deck">
                    <div class="deck-column mobile-column" id="col-todo">
                        <div class="column-top">
                            <div class="title-flow"><span class="neon-glow-dot dot-todo"></span><h2>In Coda</h2></div>
                            <span class="badge-counter" id="count-todo">0</span>
                        </div>
                        <div class="task-dropzone" id="list-todo"></div>
                    </div>

                    <div class="deck-column mobile-column" id="col-progress">
                        <div class="column-top">
                            <div class="title-flow"><span class="neon-glow-dot dot-progress"></span><h2>In Corso</h2></div>
                            <span class="badge-counter" id="count-progress">0</span>
                        </div>
                        <div class="task-dropzone" id="list-progress"></div>
                    </div>

                    <div class="deck-column mobile-column" id="col-done">
                        <div class="column-top">
                            <div class="title-flow"><span class="neon-glow-dot dot-done"></span><h2>Risolti</h2></div>
                            <div class="done-header-actions">
                                <button id="btn-clear-done" class="btn-clear-column-action">Svuota 🗑️</button>
                                <span class="badge-counter" id="count-done">0</span>
                            </div>
                        </div>
                        <div class="task-dropzone" id="list-done"></div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Barra Inferiore Mobile -->
        <nav class="mobile-nav-bar">
            <button class="nav-item active" id="nav-todo" onclick="switchMobileView('todo')">
                <span class="nav-icon">📋</span><span class="nav-label">In Coda</span>
            </button>
            <button class="nav-item" id="nav-progress" onclick="switchMobileView('progress')">
                <span class="nav-icon">⚡</span><span class="nav-label">Focus</span>
            </button>
            <button class="nav-item" id="nav-done" onclick="switchMobileView('done')">
                <span class="nav-icon">✅</span><span class="nav-label">Risolti</span>
            </button>
            <button class="nav-item nav-item-add" id="nav-form" onclick="switchMobileView('form')">
                <span class="nav-icon">+</span><span class="nav-label">Nuovo</span>
            </button>
        </nav>
    </div>

    <script src="script.js?v=26.0"></script>
</body>
</html>
